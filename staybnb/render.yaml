services:
  - type: web
    name: staybnb-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: sqlite:////var/data/staybnb.db
    disk:
      name: staybnb-data
      mountPath: /var/data
      sizeGB: 1
